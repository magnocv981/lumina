name: Build Native Installers (Windows Tauri + Android APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-tauri:
    name: Compilar Instalador Windows (.exe NSIS e .msi)
    runs-on: windows-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Rust Toolchain Estável
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de dependências Cargo/Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências com Bun
        run: bun install

      - name: Gerar build dos instaladores Tauri (NSIS .exe + MSI)
        run: bunx @tauri-apps/cli@2 build --bundles nsis,msi
        env:
          CI: true

      - name: Publicar Instaladores Windows como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: lumina-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

  build-android-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Rust e Targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Instalar Android Platform 34 e NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Cache de dependências Cargo/Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências com Bun
        run: bun install

      - name: Inicializar Projeto Android do Tauri
        run: |
          bunx @tauri-apps/cli@2 android init --ci
          chmod +x src-tauri/gen/android/gradlew || true

      - name: Compilar APK Android
        run: bunx @tauri-apps/cli@2 android build --apk --target aarch64 --target armv7
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.NDK_HOME }}

      - name: Publicar APK Android como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: lumina-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
